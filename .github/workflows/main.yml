name: CI/CD Pipeline - Study Case

on:
  push:
    branches: ['**']
    paths-ignore:
      - '.gitignore'
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

permissions: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: set up python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: run unit tests with coverage
        run: |
          PYTHONPATH=. pytest tests/ --ignore=tests/test_integration.py -v \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term

      - name: sonarcloud scan
        uses: SonarSource/sonarqube-scan-action@0303d6b62e310685c0e34d0b9cde218036885c4d  # v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.python.coverage.reportPaths=coverage.xml

      - name: trivy vulnerability scan
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297  # master
        with:
          scan-type: 'fs'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: set up docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: build docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          push: false
          load: false
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: login to github container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set up docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: build and push docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          push: true
          load: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: set up kind cluster
        id: kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind create cluster --name kind
          kubectl cluster-info

      - name: install metrics-server
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          kubectl patch deployment metrics-server -n kube-system \
            --type='json' \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl rollout status deployment/metrics-server -n kube-system --timeout=60s

      - name: load image into kind
        run: kind load docker-image ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: deploy to kubernetes
        run: |
          sed -i "s|image: .*cicd-pipeline.*|image: ghcr.io/${{ github.repository }}:${{ github.sha }}|" k8s/deployment.yml
          kubectl apply -f k8s/
          kubectl rollout status deployment/random-app --timeout=120s
          echo "DEPLOY_END=$(date +%s)" >> $GITHUB_ENV

      - name: expose service for DAST
        run: kubectl port-forward svc/random-app-service 8000:8000 &

      - name: wait for service
        run: sleep 5

      - name: install test dependencies
        run: pip install pytest httpx

      - name: integration test
        run: PYTHONPATH=. pytest tests/test_integration.py -v

      - name: OWASP ZAP DAST scan
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed  # v0.14.0
        with:
          target: 'http://localhost:8000'
          fail_action: false
          allow_issue_writing: false

      - name: set up java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: performance test with gatling
        run: |
          kubectl get hpa random-app-hpa -w &
          mvn -f gatling/pom.xml gatling:test

      - name: rollback on failure
        if: failure() && steps.kind.outcome == 'success'
        run: |
          ROLLBACK_START=$(date +%s)
          kubectl rollout undo deployment/random-app || true
          ROLLBACK_END=$(date +%s)
          echo "TIME_TO_RESTORE=$((ROLLBACK_END - ROLLBACK_START))" >> $GITHUB_ENV

      - name: DORA metrics summary
        if: always()
        run: |
          echo "=========================================="
          echo "           DORA Metrics Summary"
          echo "=========================================="

          COMMIT_TIME=$(git log -1 --format="%ct")
          NOW=$(date +%s)
          LEAD_TIME=$((NOW - COMMIT_TIME))
          echo "Lead Time for Changes : $((LEAD_TIME / 60))m $((LEAD_TIME % 60))s"

          echo "Deployment Frequency  : 1 deployment ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          echo "  Branch              : ${{ github.ref_name }}"
          echo "  Commit              : ${{ github.sha }}"

          if [ -n "${TIME_TO_RESTORE}" ]; then
            echo "Change Failure Rate   : FAILED → Rollback executed"
            echo "Time to Restore       : ${TIME_TO_RESTORE}s (automatic rollback)"
          else
            echo "Change Failure Rate   : SUCCESS (no rollback needed)"
            echo "Time to Restore       : N/A"
          fi

          echo "=========================================="