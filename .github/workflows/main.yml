name: CI/CD Pipeline - Study Case

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions: {}  # alle Permissions gesperrt by default

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write        # SonarCloud Check-Status
    steps:
      - name: checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: set up python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: run unit tests with coverage
        run: |
          PYTHONPATH=. pytest tests/ --ignore=tests/test_integration.py -v \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term

      - name: sonarcloud scan
        uses: SonarSource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e  # master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.python.coverage.reportPaths=coverage.xml

      - name: trivy vulnerability scan
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297  # master
        with:
          scan-type: 'fs'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: build docker image
        run: docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} .

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write      # ghcr.io push
    steps:
      - name: checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: record pipeline start
        run: echo "PIPELINE_START=$(date +%s)" >> $GITHUB_ENV

      - name: login to github container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: set up kind cluster
        id: kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind create cluster --name kind
          kubectl cluster-info

      - name: load image into kind
        run: kind load docker-image ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: deploy to kubernetes
        run: |
          sed -i "s|image: .*cicd-pipeline.*|image: ghcr.io/${{ github.repository }}:${{ github.sha }}|" k8s/deployment.yml
          kubectl apply -f k8s/
          kubectl rollout status deployment/random-app --timeout=120s
          echo "DEPLOY_END=$(date +%s)" >> $GITHUB_ENV

      - name: expose service for DAST
        run: kubectl port-forward svc/random-app-service 8000:8000 &

      - name: wait for service
        run: sleep 5

      - name: install test dependencies
        run: pip install pytest httpx

      - name: integration test
        run: PYTHONPATH=. pytest tests/test_integration.py -v

      - name: OWASP ZAP DAST scan
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed  # v0.14.0
        with:
          target: 'http://localhost:8000'
          fail_action: false
          allow_issue_writing: false

      - name: performance test
        run: |
          curl -Lo k6.tar.gz https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz
          tar -xzf k6.tar.gz
          sudo mv k6-v0.54.0-linux-amd64/k6 /usr/local/bin/k6
          kubectl get hpa random-app-hpa -w &
          k6 run tests/load_test.js

      - name: rollback on failure
        if: failure() && steps.kind.outcome == 'success'
        run: |
          ROLLBACK_START=$(date +%s)
          kubectl rollout undo deployment/random-app || true
          ROLLBACK_END=$(date +%s)
          echo "TIME_TO_RESTORE=$((ROLLBACK_END - ROLLBACK_START))" >> $GITHUB_ENV

      - name: DORA metrics summary
        if: always()
        run: |
          echo "=========================================="
          echo "           DORA Metrics Summary"
          echo "=========================================="

          COMMIT_TIME=$(git log -1 --format="%ct")
          NOW=$(date +%s)
          LEAD_TIME=$((NOW - COMMIT_TIME))
          echo "Lead Time for Changes : $((LEAD_TIME / 60))m $((LEAD_TIME % 60))s"

          echo "Deployment Frequency  : 1 deployment ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          echo "  Branch              : ${{ github.ref_name }}"
          echo "  Commit              : ${{ github.sha }}"

          if [ -n "${TIME_TO_RESTORE}" ]; then
            echo "Change Failure Rate   : FAILED → Rollback executed"
            echo "Time to Restore       : ${TIME_TO_RESTORE}s (automatic rollback)"
          else
            echo "Change Failure Rate   : SUCCESS (no rollback needed)"
            echo "Time to Restore       : N/A"
          fi

          echo "=========================================="