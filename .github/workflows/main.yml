name: CI/CD Pipeline - Study Case

on:
  push:
    branches: ['**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: run unit tests
        run: PYTHONPATH=. pytest tests/ -v

      - name: sonarcloud scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: build docker image
        run: docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} .

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: login to github container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push docker image
        run: |
            docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} .
            docker push ghcr.io/${{ github.repository }}:${{ github.sha}}

      - name: set up kind cluster
        id: kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind create cluster --name kind
          kubectl cluster-info

      - name: load image into kind
        run: kind load docker-image ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: deploy to kubernetes
        run: |
          sed -i "s|image: .*cicd-pipeline.*|image: ghcr.io/${{ github.repository }}:${{ github.sha }}|" k8s/deployment.yml
          kubectl apply -f k8s/
          kubectl rollout status deployment/random-app --timeout=120s

      - name: expose service for DAST
        run: kubectl port-forward svc/random-app-service 8000:8000 &

      - name: wait for service
        run: sleep 5

      - name: OWASP ZAP DAST scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:8000'
          fail_action: false
          allow_issue_writing: false

      - name: performance test
        run: |
          curl -Lo k6.tar.gz https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz
          tar -xzf k6.tar.gz
          sudo mv k6-v0.54.0-linux-amd64/k6 /usr/local/bin/k6
          kubectl get hpa random-app-hpa -w &
          k6 run tests/load_test.js

      - name: rollback on failure
        if: failure() && steps.kind.outcome == 'success'
        run: kubectl rollout undo deployment/random-app || true